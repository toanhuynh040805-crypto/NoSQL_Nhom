name: NoSQL restaurant - build checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm run install:all
      - name: Check backend entry point
        run: npm run check --prefix backend
      - name: Check backend modules (syntax)
        run: find backend/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build frontend
        run: npm run build
